---
layout: default
---

<script src="/static/remark-0.14.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS_HTML&delayStartupUntil=configured"></script>

<script>
  // MathJax configuration
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$','$'], ['\\(','\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      processEscapes: true
    }
  });
  MathJax.Hub.Configured();

  /**
   * INJECTION LOGIC:
   * We retrieve the raw Markdown from the 'slides' collection 
   * based on the 'slides' variable in the post's front matter.
   */
  {% assign slide_slug = page.slides | replace: ".md", "" | replace: ".markdown", "" %}
  {% assign slide_file = site.slides | where: "slug", slide_slug | first %}

  {% if slide_file %}
    // Successfully found the markdown in _slides/
    var source = {{ slide_file.content | jsonify }};
  {% else %}
    // Fallback: Using the page content if no collection match is found
    var source = {{ page.content | jsonify }};
  {% endif %}

  // Initialize the slideshow
  var slideshow = remark.create({
    source: source,
    highlightStyle: 'googlecode',
    highlightLines: true,
    ratio: '16:9'
  });

  // Re-render math formulas after Remark loads the slides
  MathJax.Hub.Queue(["Typeset", MathJax.Hub]);
</script>

<style>
  /* Fix to ensure the slideshow covers the full screen area */
  .remark-container { background: #272822; }
  body { overflow: hidden; }
</style>
