---
layout: base
---

<script src="/static/remark-0.14.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS_HTML&delayStartupUntil=configured"></script>

<script>
  // MathJax basic configuration
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$','$'], ['\\(','\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      processEscapes: true,
      skipTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  });
  MathJax.Hub.Configured();

  /**
   * RECOVERY STRATEGY: 
   * Instead of fetching via XMLHttpRequest (which often fails due to incorrect paths),
   * we use Jekyll/Liquid to find the slide content during build time.
   */

  {% comment %}
    Search for the slide content in the 'slides' collection using the 'slides' variable from the post's Front Matter.
  {% endcomment %}
  {% assign slide_source = site.slides | where: "slug", page.slides | first %}

  {% if slide_source %}
    // Found in slides collection: Injecting content directly into a JS variable
    var source = {{ slide_source.content | jsonify }};
  {% else %}
    // Fallback: If not found in collection, try to use the current page's content
    var source = {{ page.content | jsonify }};
  {% endif %}

  // Initialize Remark slideshow using the source variable
  var slideshow = remark.create({
    source: source,
    highlightStyle: 'googlecode',
    highlightLines: true,
    ratio: '16:9'
  });

  // Re-trigger MathJax to process the new slides injected by Remark
  MathJax.Hub.Queue(["Typeset", MathJax.Hub]);
</script>
