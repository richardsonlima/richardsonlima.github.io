<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer | Deep Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #1a1a1a;
            --primary-accent: #145a32;
            --primary-hover: #1e8449;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Efeito de fundo sutil similar ao Aeon */
        body::before {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at center, rgba(20, 90, 50, 0.15) 0%, var(--bg-color) 70%);
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -1px; }
        .logo span { color: var(--primary-hover); }

        /* TIMER DISPLAY */
        .timer-display {
            display: flex;
            gap: 15px;
            justify-content: center;
            perspective: 1000px;
            margin-bottom: 40px;
        }

        .flip-card {
            position: relative;
            width: 160px;
            height: 200px;
            background-color: var(--card-bg);
            border-radius: 12px;
            font-size: 8rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            color: var(--text-muted);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .flip-card::after {
            content: "";
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 2px;
            background: rgba(0,0,0,0.6);
            z-index: 5;
        }

        .top, .bottom {
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .top {
            align-items: flex-end;
            background-color: #161616;
            border-radius: 12px 12px 0 0;
        }

        .bottom {
            align-items: flex-start;
            border-radius: 0 0 12px 12px;
        }

        /* Animação de Flip */
        .flip { animation: flipAnim 0.6s ease-in-out; }
        @keyframes flipAnim {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-360deg); }
        }

        /* CONTROLS */
        #start-btn {
            background-color: var(--primary-accent);
            color: white;
            border: 1px solid var(--primary-hover);
            padding: 15px 50px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 50px;
        }

        #start-btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        #start-btn:active { transform: translateY(0); }

        /* TODO SECTION */
        .todo-section { text-align: left; border-top: 1px solid var(--border-color); padding-top: 30px; }
        .todo-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        
        #todo-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 6px;
            outline: none;
        }

        #add-todo-btn {
            background: var(--card-bg);
            color: white;
            border: 1px solid var(--border-color);
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .todo-item {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary-accent);
            transition: 0.3s;
        }

        .todo-item.completed { opacity: 0.4; text-decoration: line-through; }
        .delete-task { background: none; border: none; color: #ff5f56; cursor: pointer; font-size: 1rem; }

        @keyframes alarmFlash {
            0% { background-color: var(--bg-color); }
            50% { background-color: #3e0e0e; }
            100% { background-color: var(--bg-color); }
        }

        @media (max-width: 480px) {
            .flip-card { width: 120px; height: 160px; font-size: 5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">Focus<span>Timer</span></div>
            <button style="background:none; border:none; color:var(--text-muted); cursor:pointer;">⚙️</button>
        </header>

        <div class="timer-display">
            <div class="flip-card" id="min-card">
                <div class="top">25</div>
                <div class="bottom">25</div>
            </div>
            <div class="flip-card" id="sec-card">
                <div class="top">00</div>
                <div class="bottom">00</div>
            </div>
        </div>

        <button id="start-btn">Start Focus</button>

        <div class="todo-section">
            <div class="todo-input-group">
                <input type="text" id="todo-input" placeholder="O que vamos focar agora?">
                <button id="add-todo-btn">+</button>
            </div>
            <ul id="todo-list" style="list-style: none;"></ul>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Som de click mecânico
        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function updateCard(id, value) {
            const card = document.getElementById(id);
            const top = card.querySelector('.top');
            const bottom = card.querySelector('.bottom');
            const formatted = String(value).padStart(2, '0');

            if (top.innerText !== formatted) {
                card.classList.remove('flip');
                void card.offsetWidth;
                card.classList.add('flip');
                top.innerText = formatted;
                bottom.innerText = formatted;
                playTickSound();
            }
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                startBtn.innerText = "Start Focus";
            } else {
                startBtn.innerText = "Pause";
                timerId = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        document.body.style.animation = "alarmFlash 0.5s infinite";
                        alert("Pomodoro finalizado!");
                        document.body.style.animation = "none";
                        timeLeft = 25 * 60;
                        return;
                    }
                    timeLeft--;
                    updateCard('min-card', Math.floor(timeLeft / 60));
                    updateCard('sec-card', timeLeft % 60);
                }, 1000);
            }
        });

        // Lógica da Lista de Tarefas
        const todoInput = document.getElementById('todo-input');
        const addTodoBtn = document.getElementById('add-todo-btn');
        const todoList = document.getElementById('todo-list');

        function addTask() {
            const text = todoInput.value.trim();
            if (!text) return;
            const li = document.createElement('li');
            li.className = 'todo-item';
            li.innerHTML = `<span style="cursor:pointer">${text}</span><button class="delete-task">✕</button>`;
            
            li.querySelector('span').onclick = () => li.classList.toggle('completed');
            li.querySelector('.delete-task').onclick = () => li.remove();
            
            todoList.appendChild(li);
            todoInput.value = "";
        }

        addTodoBtn.onclick = addTask;
        todoInput.onkeypress = (e) => { if(e.key === 'Enter') addTask(); };
    </script>
</body>
</html>
