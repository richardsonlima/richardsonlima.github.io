<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Timer | Deep Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #1a1a1a;
            --primary-accent: #145a32;
            --primary-hover: #1e8449;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; /* Centralização absoluta vertical */
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* TIMER DISPLAY */
        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            perspective: 1000px;
        }

        /* CARTÃO FLIP */
        .flip-card {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 42vw;
            max-width: 280px;
            height: 55vw;
            max-height: 380px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 32vw; /* Tamanho massivo */
            font-weight: 700;
            line-height: 0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .top, .bottom {
            height: 50%;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            background-color: var(--card-bg);
            position: relative;
        }

        /* CORREÇÃO DA DUPLICAÇÃO: Cortando o número ao meio */
        .top {
            align-items: flex-end;
            border-radius: 12px 12px 0 0;
            background-color: #161616;
            border-bottom: 1px solid rgba(0,0,0,0.6);
            padding-bottom: 0.5vw;
        }

        .bottom {
            align-items: flex-start;
            border-radius: 0 0 12px 12px;
            padding-top: 0.5vw;
        }

        /* SEPARADOR ":" */
        .separator {
            font-size: 15vw;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary-hover);
            font-weight: 700;
            margin-top: -5vw;
        }

        /* ANIMAÇÃO GIRATÓRIA (FLIP) */
        .flip-anim {
            animation: flipRotate 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes flipRotate {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(-90deg); }
            100% { transform: rotateX(0); }
        }

        /* AJUSTES PARA DESKTOP/IPAD */
        @media (min-width: 768px) {
            .flip-card { width: 220px; height: 300px; font-size: 200px; }
            .separator { font-size: 100px; margin-top: -20px; }
            .timer-display { gap: 20px; }
        }

        /* CONTROLS */
        .controls {
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
        }

        #start-btn {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            border: none;
            background: var(--primary-accent);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        #start-btn:active { transform: scale(0.95); }

        /* LISTA DE TAREFAS */
        .todo-container {
            width: 100%;
            max-width: 400px;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
        }

        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        #add-btn {
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background: var(--card-bg);
            color: white;
            cursor: pointer;
        }

        .task {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid var(--primary-accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="timer-display">
            <div class="flip-card" id="min-card">
                <div class="top">25</div>
                <div class="bottom">25</div>
            </div>
            <div class="separator">:</div>
            <div class="flip-card" id="sec-card">
                <div class="top">00</div>
                <div class="bottom">00</div>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn">Começar Foco</button>
        </div>

        <div class="todo-container">
            <div class="todo-input-group">
                <input type="text" id="todo-in" placeholder="Próxima tarefa...">
                <button id="add-btn">+</button>
            </div>
            <div id="task-list"></div>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;

        function updateCard(id, value) {
            const card = document.getElementById(id);
            const top = card.querySelector('.top');
            const bottom = card.querySelector('.bottom');
            const val = String(value).padStart(2, '0');

            if (top.innerText !== val) {
                // Trigger animação giratória
                card.classList.remove('flip-anim');
                void card.offsetWidth; // Force reflow
                card.classList.add('flip-anim');
                
                top.innerText = val;
                bottom.innerText = val;
            }
        }

        const btn = document.getElementById('start-btn');
        btn.onclick = () => {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                btn.innerText = "Continuar";
            } else {
                btn.innerText = "Pausar";
                timerId = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        alert("Sessão finalizada!");
                        return;
                    }
                    timeLeft--;
                    updateCard('min-card', Math.floor(timeLeft / 60));
                    updateCard('sec-card', timeLeft % 60);
                }, 1000);
            }
        };

        // Tasks
        const input = document.getElementById('todo-in');
        const add = document.getElementById('add-btn');
        const list = document.getElementById('task-list');

        add.onclick = () => {
            if (!input.value) return;
            const div = document.createElement('div');
            div.className = 'task';
            div.innerHTML = `<span>${input.value}</span>`;
            list.prepend(div);
            input.value = "";
        };
    </script>
</body>
</html>
