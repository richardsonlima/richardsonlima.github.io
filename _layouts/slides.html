---
layout: base
---

<script src="/static/remark-0.14.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS_HTML&delayStartupUntil=configured"></script>

<script>
  // MathJax basic configuration
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$','$'], ['\\(','\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      processEscapes: true
    }
  });
  MathJax.Hub.Configured();

  /**
   * DEFINITIVE INJECTION STRATEGY:
   * We retrieve the raw Markdown from the '_slides' collection.
   */
  
  {% comment %} 
    We extract the filename from the post and find its match in the collection
  {% endcomment %}
  {% assign slide_identifier = page.slides | replace: ".md", "" | replace: ".markdown", "" %}
  {% assign slide_entry = site.slides | where: "slug", slide_identifier | first %}

  {% if slide_entry %}
    // Found in _slides: Injecting raw markdown content
    var source = {{ slide_entry.content | jsonify }};
  {% else %}
    // Error fallback: If slide file is missing, show a warning
    var source = "# Error\nSlide content not found in _slides collection.\nCheck if folder is named '_slides' and filename matches.";
  {% endif %}

  // Initialize Remark
  var slideshow = remark.create({
    source: source,
    highlightStyle: 'googlecode',
    highlightLines: true,
    ratio: '16:9'
  });

  // Re-trigger MathJax for the new slides
  MathJax.Hub.Queue(["Typeset", MathJax.Hub]);
</script>
