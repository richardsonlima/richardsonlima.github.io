<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Timer | Æon Deep Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #1a1a1a;
            --primary-accent: #145a32;
            --primary-hover: #1e8449;
            --text-main: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; /* Centralização real no iPhone/Android */
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* TIMER DISPLAY */
        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
            perspective: 1500px; /* Profundidade para o efeito Flip */
        }

        /* COMPONENTE FLIP CARD */
        .flip-card {
            position: relative;
            width: 42vw;
            max-width: 260px;
            height: 55vw;
            max-height: 340px;
            background-color: var(--card-bg);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 38vw; /* Tamanho massivo */
            font-weight: 700;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        /* METADES DO CARTÃO */
        .top, .bottom {
            height: 50%;
            width: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            background-color: var(--card-bg);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .top {
            align-items: flex-end;
            border-radius: 12px 12px 0 0;
            background-color: #161616;
            border-bottom: 1px solid rgba(0,0,0,0.5);
            line-height: 0; /* Alinhamento preciso */
        }

        .bottom {
            align-items: flex-start;
            border-radius: 0 0 12px 12px;
            line-height: 0; /* Alinhamento preciso */
        }

        /* SEPARADOR ":" */
        .separator {
            font-size: 15vw;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary-hover);
            font-weight: 700;
            padding-bottom: 5vw;
        }

        /* ANIMAÇÃO DE FLIP REAL (3D FOLD) */
        .flip-animate {
            animation: flipFold 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes flipFold {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(-90deg); filter: brightness(1.2); }
            100% { transform: rotateX(0deg); }
        }

        /* AJUSTES PARA DISPOSITIVOS MAIORES (IPAD/NOTEBOOK) */
        @media (min-width: 768px) {
            .flip-card { width: 200px; height: 280px; font-size: 180px; }
            .separator { font-size: 80px; padding-bottom: 20px; }
            .timer-display { gap: 20px; }
        }

        @media (min-width: 1200px) {
            .flip-card { width: 280px; height: 380px; font-size: 240px; }
        }

        /* CONTROLS */
        .controls { width: 100%; max-width: 400px; margin-bottom: 40px; }
        #start-btn {
            width: 100%; padding: 22px; border-radius: 16px; border: none;
            background: var(--primary-accent); color: white;
            font-size: 1.2rem; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(20, 90, 50, 0.3);
        }
        #start-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

        /* LISTA DE TAREFAS */
        .todo-container {
            width: 100%; max-width: 400px;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
        }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            padding: 16px; border-radius: 12px; color: white; outline: none;
        }
        #add-btn {
            padding: 0 20px; border-radius: 12px; border: none;
            background: var(--card-bg); color: white; cursor: pointer;
        }
        .task {
            background: var(--card-bg); padding: 15px; border-radius: 10px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            border-left: 4px solid var(--primary-accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="timer-display">
            <div class="flip-card" id="min-card">
                <div class="top">25</div>
                <div class="bottom">25</div>
            </div>
            <div class="separator">:</div>
            <div class="flip-card" id="sec-card">
                <div class="top">00</div>
                <div class="bottom">00</div>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn">Começar Foco</button>
        </div>

        <div class="todo-container">
            <div class="input-group">
                <input type="text" id="todo-in" placeholder="Qual o próximo passo?">
                <button id="add-btn">+</button>
            </div>
            <div id="task-list"></div>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;

        function updateCard(id, value) {
            const card = document.getElementById(id);
            const top = card.querySelector('.top');
            const bottom = card.querySelector('.bottom');
            const newVal = String(value).padStart(2, '0');

            if (top.innerText !== newVal) {
                // Efeito de Flip 3D
                card.classList.remove('flip-animate');
                void card.offsetWidth; // Força re-renderização do CSS
                card.classList.add('flip-animate');
                
                top.innerText = newVal;
                bottom.innerText = newVal;
            }
        }

        const btn = document.getElementById('start-btn');
        btn.onclick = () => {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                btn.innerText = "Continuar";
                btn.style.background = "var(--primary-accent)";
            } else {
                btn.innerText = "Pausar";
                btn.style.background = "#cc7832"; // Cor de aviso/pausa
                timerId = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        alert("Pomodoro Concluído!");
                        return;
                    }
                    timeLeft--;
                    updateCard('min-card', Math.floor(timeLeft / 60));
                    updateCard('sec-card', timeLeft % 60);
                }, 1000);
            }
        };

        // Tasks Simple Logic
        const input = document.getElementById('todo-in');
        const add = document.getElementById('add-btn');
        const list = document.getElementById('task-list');

        add.onclick = () => {
            if (!input.value.trim()) return;
            const div = document.createElement('div');
            div.className = 'task';
            div.innerHTML = `<span>${input.value}</span>`;
            list.prepend(div);
            input.value = "";
        };
    </script>
</body>
</html>
