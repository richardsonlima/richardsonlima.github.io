# -----------------------------------------------------------------------------
# Build Settings & Collections
# -----------------------------------------------------------------------------

# Collections allow Jekyll to treat files in _slides/ as a managed group.
collections:
  hidden:
    output: true
    permalink: /hidden/:name/
  
  # The 'slides' collection processes Markdown files in the /_slides/ directory.
  # output: true ensures Jekyll generates a static HTML page for each entry.
  slides:
    output: true
    permalink: /slides/:name

# Defaults: Assigning layouts to folders and collections.
# Note: In Jekyll, all defaults should be in a single list to avoid overrides.
defaults:
  - scope:
      path: ""
      type: hidden
    values:
      layout: page
      sitemap: false
      robots: noindex
  
  - scope:
      path: ""
    values:
      layout: post

  - scope:
      path: "_posts"
    values:
      layout: post

  # Ensures any file within the _slides directory automatically uses the 'slides' layout.
  - scope:
      path: "_slides"
    values:
      layout: slides

# -----------------------------------------------------------------------------
# Markdown & Performance Settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
lstrip_whitespace: true

# kramdown configuration for GFM (GitHub Flavored Markdown) and syntax highlighting.
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Performance: Enables browser-level lazy loading for images.
lazy_loading_images: true

# -----------------------------------------------------------------------------
# Plugins (All original plugins preserved)
# -----------------------------------------------------------------------------

plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

