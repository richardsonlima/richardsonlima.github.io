<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Timer | Deep Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #1a1a1a;
            --primary-accent: #145a32;
            --primary-hover: #1e8449;
            --text-main: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; /* Centralização vertical dinâmica */
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TIMER DISPLAY - NÚMEROS GIGANTES E SEM DUPLICAÇÃO */
        .timer-display {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-bottom: 3rem;
            width: 100%;
        }

        .flip-card {
            position: relative;
            width: 40vw; 
            max-width: 260px;
            height: 50vw;
            max-height: 340px;
            background-color: var(--card-bg);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            font-size: 35vw; /* Tamanho massivo */
            line-height: 1;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* AJUSTE PARA TABLETS E DESKTOPS */
        @media (min-width: 768px) {
            .flip-card { width: 22vw; height: 30vw; font-size: 22vw; }
            .timer-display { gap: 20px; }
        }
        @media (min-width: 1200px) {
            .flip-card { width: 280px; height: 380px; font-size: 16rem; }
        }

        .top, .bottom {
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .top {
            align-items: flex-end; /* Alinha o texto para baixo na metade superior */
            background-color: #161616;
            border-radius: 12px 12px 0 0;
            border-bottom: 1px solid rgba(0,0,0,0.5);
        }

        .bottom {
            align-items: flex-start; /* Alinha o texto para cima na metade inferior */
            border-radius: 0 0 12px 12px;
        }

        /* Separador ":" centralizado */
        .separator {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10vw;
            color: var(--primary-hover);
            font-weight: bold;
            padding-bottom: 2vw;
        }

        @media (min-width: 768px) { .separator { font-size: 5vw; } }

        /* CONTROLS */
        .controls-wrapper { width: 100%; max-width: 400px; margin-bottom: 3rem; }
        
        #start-btn {
            background-color: var(--primary-accent);
            color: white;
            border: 1px solid var(--primary-hover);
            padding: 16px 0;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s ease;
        }

        #start-btn:active { transform: scale(0.98); }

        /* TODO SECTION */
        .todo-section { width: 100%; max-width: 400px; text-align: left; border-top: 1px solid var(--border-color); padding-top: 25px; }
        .todo-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        #todo-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; outline: none; }
        #add-todo-btn { background: var(--card-bg); color: white; border: 1px solid var(--border-color); padding: 0 15px; border-radius: 8px; cursor: pointer; }

        .todo-item { background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; border-left: 4px solid var(--primary-accent); }
    </style>
</head>
<body>

    <div class="container">
        <div class="timer-display">
            <div class="flip-card" id="min-card">
                <div class="top">25</div>
                <div class="bottom">25</div>
            </div>
            <div class="separator">:</div>
            <div class="flip-card" id="sec-card">
                <div class="top">00</div>
                <div class="bottom">00</div>
            </div>
        </div>

        <div class="controls-wrapper">
            <button id="start-btn">Start Focus</button>
        </div>

        <div class="todo-section">
            <div class="todo-input-group">
                <input type="text" id="todo-input" placeholder="O que vamos focar agora?">
                <button id="add-todo-btn">+</button>
            </div>
            <ul id="todo-list" style="list-style: none;"></ul>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;

        function updateCard(id, value) {
            const card = document.getElementById(id);
            const top = card.querySelector('.top');
            const bottom = card.querySelector('.bottom');
            const formatted = String(value).padStart(2, '0');

            if (top.innerText !== formatted) {
                top.innerText = formatted;
                bottom.innerText = formatted;
            }
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                startBtn.innerText = "Start Focus";
            } else {
                startBtn.innerText = "Pause";
                timerId = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        alert("Pomodoro finalizado!");
                        timeLeft = 25 * 60;
                        updateCard('min-card', 25);
                        updateCard('sec-card', 0);
                        return;
                    }
                    timeLeft--;
                    updateCard('min-card', Math.floor(timeLeft / 60));
                    updateCard('sec-card', timeLeft % 60);
                }, 1000);
            }
        });

        const todoInput = document.getElementById('todo-input');
        const addTodoBtn = document.getElementById('add-todo-btn');
        const todoList = document.getElementById('todo-list');

        addTodoBtn.onclick = () => {
            const text = todoInput.value.trim();
            if (!text) return;
            const li = document.createElement('li');
            li.className = 'todo-item';
            li.innerHTML = `<span>${text}</span>`;
            todoList.prepend(li);
            todoInput.value = "";
        };
    </script>
</body>
</html>
