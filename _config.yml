# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------

# Collections: Essential for the AI Tutoring slides to be processed correctly.
collections:
  hidden:
    output: true
    permalink: /hidden/:name/

  # The 'slides' collection will process files in the /_slides/ directory.
  # output: true ensures Jekyll generates a static HTML page for each slide.
  slides:
    output: true
    permalink: /slides/:name

# Defaults: Assigning default layouts to collections and paths
defaults:
  - scope:
      path: ""
      type: hidden
    values:
      layout: page
      sitemap: false
      robots: noindex

  - scope:
      path: "_posts"
    values:
      layout: "posts"

  # Fix for the slides directory: Automatically assigns the 'slides' layout
  # and ensures they are processed by the collections engine.
  - scope:
      path: "_slides"
    values:
      layout: "slides"

# -----------------------------------------------------------------------------
# Performance and Markdown
# -----------------------------------------------------------------------------

lazy_loading_images: true # enables lazy loading of images (recommended)

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: true
enable_google_verification: true
enable_bing_verification: true
enable_math: true 
enable_darkmode: true
enable_navbar_social: true
enable_project_categories: true

# -----------------------------------------------------------------------------
# Library versions (Original Settings Preserved)
# -----------------------------------------------------------------------------

third_party_libraries:
  download: false
  mathjax:
    integrity:
      js: "sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI="
    local:
      fonts: "output/chtml/fonts/woff-v2/"
    url:
      fonts: "https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/output/chtml/fonts/woff-v2/"
      js: "https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/tex-mml-chtml.js"
    version: "3.2.2"
  mermaid:
    integrity:
      js: "sha256-TtLOdUA8mstPoO6sGvHIGx2ceXrrX4KgIItO06XOn8A="
    url:
      js: "https://cdn.jsdelivr.net/npm/mermaid@{{version}}/dist/mermaid.min.js"
    version: "10.7.0"
  plotly:
    integrity:
      js: "sha256-oy6Be7Eh6eiQFs5M7oXuPxxm9qbJXEtTpfSI93dW16Q="
    url:
      js: "https://cdn.jsdelivr.net/npm/plotly.js@{{version}}/dist/plotly.min.js"
    version: "3.0.1"
  polyfill:
    url:
      js: "https://cdnjs.cloudflare.com/ajax/libs/polyfill/v{{version}}/polyfill.min.js?features=es6"
    version: "3"

# Plug-ins (Original List Preserved)
plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

