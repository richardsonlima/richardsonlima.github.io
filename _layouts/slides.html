---
layout: base
---

<script src="/static/remark-0.14.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS_HTML&delayStartupUntil=configured"></script>

<script>
  // MathJax basic configuration
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$','$'], ['\\(','\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      processEscapes: true,
      skipTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  });
  MathJax.Hub.Configured();

  /**
   * ADJUSTED STRATEGY:
   * We avoid XMLHttpRequest because Jekyll doesn't serve raw .md files after build.
   * Instead, we use Liquid to find the raw content of the slide in the collection
   * and inject it directly into the 'source' variable as a JSON-encoded string.
   */

  {% comment %}
    1. Get the slide filename from the post's Front Matter (e.g., ai-tutoring-module-01...)
    2. We clean the extension to match Jekyll's internal slug.
  {% endcomment %}
  {% assign slide_identifier = page.slides | replace: ".md", "" | replace: ".markdown", "" %}
  
  {% comment %}
    3. Search specifically in the 'slides' collection.
  {% endcomment %}
  {% assign slide_data = site.slides | where: "slug", slide_identifier | first %}

  {% if slide_data %}
    // Found in _slides collection: Injecting RAW markdown content
    var source = {{ slide_data.content | jsonify }};
  {% else %}
    // Fallback: If no match in collection, use the current page's raw content
    var source = {{ page.content | jsonify }};
  {% endif %}

  // Initialize Remark slideshow using the source variable
  var slideshow = remark.create({
    source: source,
    highlightStyle: 'googlecode',
    highlightLines: true,
    ratio: '16:9'
  });

  // Re-trigger MathJax to process the new slides injected by Remark
  MathJax.Hub.Queue(["Typeset", MathJax.Hub]);
</script>
